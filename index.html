<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>رسالة إلى رانيا</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;}

body{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
font-family:tahoma,arial;
color:white;
overflow:hidden;
background:linear-gradient(135deg,#ff9fbe,#ffc9dc,#ffe6f1);
}

/* الصندوق */
.container{
background:rgba(255,255,255,0.25);
backdrop-filter:blur(15px);
padding:50px;
border-radius:25px;
box-shadow:0 15px 40px rgba(0,0,0,0.2);
width:90%;
max-width:700px;
position:relative;
z-index:2;
}

/* الصورة */
.profile{
width:220px;
height:220px;
border-radius:50%;
object-fit:cover;
border:6px solid white;
box-shadow:0 0 20px rgba(0,0,0,0.35);
margin-bottom:20px;
}

h1{font-size:34px;margin:15px 0;}

p{
font-size:19px;
line-height:1.8;
}

/* الزر */
button{
margin-top:25px;
padding:14px 35px;
font-size:18px;
border:none;
border-radius:30px;
background:white;
color:#ff3b7f;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.08);
background:#ffe3ef;
}

/* القلوب الهادئة */
.heart{
position:fixed;
bottom:-40px;
font-size:20px;
animation:floatUp linear forwards;
opacity:0.7;
pointer-events:none;
}

@keyframes floatUp{
0%{transform:translateY(0);opacity:0.7;}
100%{transform:translateY(-110vh);opacity:0;}
}

</style>
</head>

<body>

<div class="container">

<img class="profile" src="https://a.top4top.io/p_3723fzcei0.jpg">

<h1>رانيا 🤍</h1>

<p>
اعرف انك ربما متضايقة الآن<br>
ولا اعرف ما الذي حدث<br><br>

لكن اردت فقط ان اقول لك شيئاً بسيطاً<br>
وجودك في حياتي شيء جميل جداً<br>
وابتسامتك تعني لي الكثير<br><br>

اتمنى ان تزول هذه الضيقة من قلبك<br>
لان قلبك يستحق الفرح دائماً
</p>

<p style="margin-top:15px;">
ابتسمي قليلاً…<br>
الدنيا تصبح اجمل عندما تبتسمين 🌸
</p>

<p style="margin-top:15px;">
من عبدالله ❤️
</p>

<button onclick="showMessage()">اضغطي هنا</button>

<p id="extra" style="margin-top:25px;font-size:20px;"></p>

<audio id="music" loop>
<source src="https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview123/v4/fb/e4/d2/fbe4d2ed-5357-9855-5898-1fad176a62bf/mzaf_11791228578074490528.plus.aac.p.m4a" type="audio/mp4">
</audio>

</div>

<script>

/* القلوب */
function createHeart(){
const heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="❤️";
heart.style.left=Math.random()*100+"vw";
heart.style.animationDuration=(6+Math.random()*4)+"s";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},9000);
}

setInterval(createHeart,800);

/* عند الضغط */
function showMessage(){

document.getElementById("extra").innerHTML=
"✨ مهما كان سبب الضيق… اتمنى ان يعود الهدوء لقلبك وتعود ابتسامتك الجميلة ✨";

document.getElementById("music").play();

}

</script>

</body>
</html>
